# TradingAgents-CN v1.0.1 Docker Compose配置
# 支持前后端分离部署

services:
  # FastAPI 后端服务
  backend:
    build:
      context: ../../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: trading-agents-backend:v1.0.1
    container_name: trading-agents-backend
    ports:
      - "8000:8000"
    volumes:
      # 日志目录映射
      - ../../../runtime/logs:/app/logs
      # 配置目录映射
      - ../../../config:/app/config
      # 数据目录映射
      - ../../../runtime/data:/app/data
      # 后端配置文件由 app.core.config.Settings 固定读取 /app/backend/.env
      - ../../../backend/.env:/app/backend/.env:ro
    env_file:
      - ../../../backend/.env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Next.js 前端服务
  frontend:
    build:
      context: ../../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    image: trading-agents-frontend:v1.0.1
    container_name: trading-agents-frontend
    ports:
      - "3000:3000"
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis 缓存服务
  redis:
    image: redis:alpine
    container_name: trading-agents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ../../../backend/.env
    environment:
      TZ: "Asia/Shanghai"
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:alpine
    container_name: trading-agents-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../../../backend/.env
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis Commander 管理界面（可选）
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: trading-agents-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ../../../backend/.env
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-trading_agents123}
    networks:
      - trading-agents-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - management

# 数据卷定义
volumes:
  redis_data:
    driver: local
    name: trading_agents_redis_data
  postgres_data:
    driver: local
    name: trading_agents_postgres_data

# 网络定义
networks:
  trading-agents-network:
    driver: bridge
    name: trading-agents-network
