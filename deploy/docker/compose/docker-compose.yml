# TradingAgents-CN v1.0.1 Docker Compose配置
# 支持前后端分离部署

services:
  # FastAPI 后端服务
  backend:
    build:
      context: ../../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: trading-agents-backend:v1.0.1
    container_name: trading-agents-backend
    ports:
      - "8000:8000"
    volumes:
      # 日志目录映射
      - ../../../runtime/logs:/app/logs
      # 配置目录映射
      - ../../../config:/app/config
      # 数据目录映射
      - ../../../runtime/data:/app/data
    env_file:
      - ../../../deploy/env/docker.env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADING_AGENTS_LOG_LEVEL: "INFO"
      TRADING_AGENTS_LOG_DIR: "/app/logs"
      TRADING_AGENTS_LOG_FILE: "/app/logs/trading_agents.log"
      # Docker专用数据库配置
      TRADING_AGENTS_REDIS_URL: redis://:trading_agents123@redis:6379
      TRADING_AGENTS_CACHE_TYPE: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trading_agents_pg123
      POSTGRES_DB: trading_agents_cn
      POSTGRES_DUAL_WRITE_ENABLED: "${POSTGRES_DUAL_WRITE_ENABLED:-true}"
      POSTGRES_READ_ENABLED: "${POSTGRES_READ_ENABLED:-true}"
      POSTGRES_DUAL_WRITE_FAIL_OPEN: "${POSTGRES_DUAL_WRITE_FAIL_OPEN:-true}"
      SYNC_STOCK_BASICS_ENABLED: "${SYNC_STOCK_BASICS_ENABLED:-true}"
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # API配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # CORS配置
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Vue 3 前端服务
  frontend:
    build:
      context: ../../..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: trading-agents-frontend:v1.0.1
    container_name: trading-agents-frontend
    ports:
      - "3000:80"
    environment:
      TZ: "Asia/Shanghai"
      # 后端API地址
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis 缓存服务
  redis:
    image: redis:latest
    container_name: trading-agents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: "Asia/Shanghai"
      REDIS_PASSWORD: "trading_agents123"
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: trading-agents-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trading_agents_pg123
      POSTGRES_DB: trading_agents_cn
      TZ: "Asia/Shanghai"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_agents_cn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis Commander 管理界面（可选）
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: trading-agents-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:trading_agents123
    networks:
      - trading-agents-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - management

# 数据卷定义
volumes:
  redis_data:
    driver: local
    name: trading_agents_redis_data
  postgres_data:
    driver: local
    name: trading_agents_postgres_data

# 网络定义
networks:
  trading-agents-network:
    driver: bridge
    name: trading-agents-network
