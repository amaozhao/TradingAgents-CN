# TradingAgents-CN v1.0.1 Docker Compose配置（带 Nginx 反向代理）
# 使用Docker Hub镜像 + Nginx 反向代理
#
# 使用方法：
# 1. 复制.env.example为.env并配置环境变量
# 2. 运行: docker compose -f deploy/docker/compose/docker-compose.hub.nginx.yml up -d
# 3. 访问: http://your-server (前端和后端API都通过80端口访问)
#
# 优势：
# - 前端和后端通过同一端口访问，无跨域问题
# - 统一入口，便于配置 HTTPS
# - 可以添加负载均衡、缓存等功能

services:
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: trading-agents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trading_agents_redis_data:/data
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --requirepass trading_agents123
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "trading_agents123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # PostgreSQL数据库
  postgres:
    image: postgres:16-alpine
    container_name: trading-agents-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - trading_agents_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trading_agents_pg123
      POSTGRES_DB: trading_agents_cn
      TZ: "Asia/Shanghai"
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_agents_cn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # FastAPI后端服务
  backend:
    # 支持本地构建或从Docker Hub拉取
    # 本地构建: docker compose -f deploy/docker/compose/docker-compose.hub.nginx.yml build backend
    # 拉取镜像: docker compose -f deploy/docker/compose/docker-compose.hub.nginx.yml pull backend
    build:
      context: ../../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: hsliup/trading-agents-backend:v1.0.1
    container_name: trading-agents-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ../../../runtime/logs:/app/logs
      # 不映射config目录，使用镜像内的配置文件
      # 如需修改配置，请修改代码后重新构建镜像
      # - ../../../config:/app/config
      - ../../../runtime/data:/app/data
    env_file:
      - ../../../deploy/env/docker.env
    environment:
      TZ: "Asia/Shanghai"
      TRADING_AGENTS_LOG_LEVEL: "INFO"
      TRADING_AGENTS_LOG_DIR: "/app/logs"
      TRADING_AGENTS_LOG_FILE: "/app/logs/trading_agents.log"
      # Redis配置
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "trading_agents123"
      REDIS_URL: "redis://:trading_agents123@redis:6379/0"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "trading_agents_pg123"
      POSTGRES_DB: "trading_agents_cn"
      POSTGRES_DUAL_WRITE_ENABLED: "${POSTGRES_DUAL_WRITE_ENABLED:-true}"
      POSTGRES_READ_ENABLED: "${POSTGRES_READ_ENABLED:-true}"
      POSTGRES_DUAL_WRITE_FAIL_OPEN: "${POSTGRES_DUAL_WRITE_FAIL_OPEN:-true}"
      SYNC_STOCK_BASICS_ENABLED: "${SYNC_STOCK_BASICS_ENABLED:-true}"
      DOCKER_CONTAINER: "true"
      # 安全配置
      JWT_SECRET: "docker-jwt-secret-key-change-in-production-2024"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CSRF_SECRET: "docker-csrf-secret-key-change-in-production-2024"
      BCRYPT_ROUNDS: "12"
      # CORS配置（允许 Nginx 代理）
      CORS_ORIGINS: "*"
      # AI模型API密钥（从.env文件读取，environment部分需要显式声明才能覆盖镜像内的占位符）
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-your_dashscope_api_key_here}"
      DASHSCOPE_ENABLED: "${DASHSCOPE_ENABLED:-false}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-your_deepseek_api_key_here}"
      DEEPSEEK_ENABLED: "${DEEPSEEK_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-your_openai_api_key_here}"
      OPENAI_ENABLED: "${OPENAI_ENABLED:-false}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-your_google_api_key_here}"
      GOOGLE_ENABLED: "${GOOGLE_ENABLED:-false}"
      BAIDU_API_KEY: "${BAIDU_API_KEY:-your_baidu_api_key_here}"
      BAIDU_SECRET_KEY: "${BAIDU_SECRET_KEY:-your_baidu_secret_key_here}"
      BAIDU_ENABLED: "${BAIDU_ENABLED:-false}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-your_openrouter_api_key_here}"
      OPENROUTER_ENABLED: "${OPENROUTER_ENABLED:-false}"
      AIHUBMIX_API_KEY: "${AIHUBMIX_API_KEY:-your_aihubmix_api_key_here}"
      AIHUBMIX_ENABLED: "${AIHUBMIX_ENABLED:-false}"
      # 数据源API密钥
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-your_tushare_token_here}"
      TUSHARE_ENABLED: "${TUSHARE_ENABLED:-false}"
      AKSHARE_ENABLED: "${AKSHARE_ENABLED:-true}"
      BAOSTOCK_ENABLED: "${BAOSTOCK_ENABLED:-true}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-your_finnhub_api_key_here}"
      FINNHUB_ENABLED: "${FINNHUB_ENABLED:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js前端服务
  frontend:
    # 支持本地构建或从Docker Hub拉取
    build:
      context: ../../..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: hsliup/trading-agents-frontend:v1.0.1
    container_name: trading-agents-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx 反向代理
  # ports可以改为8080:80,或者其它的端口映射，前面一个是外部的端口，后面一个是容器内的端口
  nginx:
    image: nginx:alpine
    container_name: trading-agents-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/reverse-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  trading_agents_redis_data:
    driver: local
  trading_agents_postgres_data:
    driver: local

networks:
  trading-agents-network:
    driver: bridge
