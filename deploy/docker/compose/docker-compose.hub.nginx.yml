# TradingAgents-CN v1.0.1 Docker Compose配置（带 Nginx 反向代理）
# 使用Docker Hub镜像 + Nginx 反向代理
#
# 使用方法：
# 1. 复制 backend/.env.example 为 backend/.env 并配置环境变量
# 2. 运行: docker compose --env-file backend/.env -f deploy/docker/compose/docker-compose.hub.nginx.yml up -d
# 3. 访问: http://your-server (前端和后端API都通过80端口访问)
#
# 优势：
# - 前端和后端通过同一端口访问，无跨域问题
# - 统一入口，便于配置 HTTPS
# - 可以添加负载均衡、缓存等功能

services:
  # Redis缓存
  redis:
    image: redis:alpine
    container_name: trading-agents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trading_agents_redis_data:/data
    env_file:
      - ../../../backend/.env
    environment:
      TZ: "Asia/Shanghai"
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # PostgreSQL数据库
  postgres:
    image: postgres:alpine
    container_name: trading-agents-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - trading_agents_postgres_data:/var/lib/postgresql
    env_file:
      - ../../../backend/.env
    environment:
      TZ: "Asia/Shanghai"
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # FastAPI后端服务
  backend:
    # 支持本地构建或从Docker Hub拉取
    # 本地构建: docker compose -f deploy/docker/compose/docker-compose.hub.nginx.yml build backend
    # 拉取镜像: docker compose -f deploy/docker/compose/docker-compose.hub.nginx.yml pull backend
    build:
      context: ../../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: hsliup/trading-agents-backend:v1.0.1
    container_name: trading-agents-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ../../../runtime/logs:/app/logs
      # 不映射config目录，使用镜像内的配置文件
      # 如需修改配置，请修改代码后重新构建镜像
      # - ../../../config:/app/config
      - ../../../runtime/data:/app/data
      - ../../../backend/.env:/app/backend/.env:ro
    env_file:
      - ../../../backend/.env
    environment:
      TZ: "Asia/Shanghai"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js前端服务
  frontend:
    # 支持本地构建或从Docker Hub拉取
    build:
      context: ../../..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: hsliup/trading-agents-frontend:v1.0.1
    container_name: trading-agents-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx 反向代理
  # ports可以改为8080:80,或者其它的端口映射，前面一个是外部的端口，后面一个是容器内的端口
  nginx:
    image: nginx:alpine
    container_name: trading-agents-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/reverse-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - trading-agents-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  trading_agents_redis_data:
    driver: local
  trading_agents_postgres_data:
    driver: local

networks:
  trading-agents-network:
    driver: bridge
